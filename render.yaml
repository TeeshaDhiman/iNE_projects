services:
  - type: web
    name: price-tracker-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
